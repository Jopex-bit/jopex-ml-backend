// Config del backend JOPEX (para traer datos reales de las publicaciones rivales)
function leerCfgBackend() {
  // Servido desde el propio backend: mismo origen y sin API key (va la cookie).
  if (typeof window !== 'undefined' && window.JOPEX_WEB === true) {
    return { url: window.location.origin, key: '' };
  }
  try {
    return {
      url: window.localStorage.getItem('jopex_backend_url') || 'https://jopex-ml-backend.onrender.com',
      key: window.localStorage.getItem('jopex_backend_key') || ''
    };
  } catch (e) {
    return { url: '', key: '' };
  }
}
function guardarCfgBackend(url, key) {
  try {
    window.localStorage.setItem('jopex_backend_url', url || '');
    window.localStorage.setItem('jopex_backend_key', key || '');
  } catch (e) {}
}

// ---------- Comparador de proveedores ----------
// Compara en DÓLARES (neutro entre fechas: no lo distorsiona el movimiento del TC).
// El botón de TC convierte todas las filas con un mismo tipo de cambio, sin tocar
// el TC propio que quedó guardado en cada cotización como referencia histórica.
function ComparadorProveedores({ items, tc, setTc }) {
  const h = React.createElement;
  const filas = items
    .map(c => ({ c, r: calcularCotizacion(c) }))
    .filter(x => x.r)
    .sort((a, b) => a.r.precioUnitUsd - b.r.precioUnitUsd);

  if (filas.length < 2) {
    return h('div', { className: 'comp-hint' },
      filas.length === 0
        ? 'Completá Cotización, Envío, % Tasa DIE, Cantidad y TC en al menos una cotización para comparar.'
        : 'Cargá una segunda cotización de este producto para ver la comparación lado a lado.');
  }

  const mejor = filas[0];
  const tcNum = Number(tc);
  const tcOk = !isNaN(tcNum) && tcNum > 0;

  return h('div', { className: 'comparador' },
    h('div', { className: 'comparador-head' },
      h('h3', null, 'Comparación de proveedores'),
      h('label', { className: 'comparador-tc' },
        h('span', null, 'Ver en $ con TC'),
        h('input', {
          type: 'number', value: tc, placeholder: 'Brubank hoy',
          onChange: e => setTc(e.target.value)
        })
      )
    ),
    h('div', { className: 'comparador-scroll' },
      h('table', { className: 'comparador-tabla' },
        h('thead', null, h('tr', null,
          h('th', null, '#'),
          h('th', null, 'Proveedor'),
          h('th', { className: 'num' }, 'Cant.'),
          h('th', { className: 'num' }, 'Landed u. USD'),
          tcOk ? h('th', { className: 'num' }, 'Landed u. ARS') : null,
          h('th', { className: 'num' }, 'Inversión total'),
          h('th', { className: 'num' }, 'Δ por unidad'),
          h('th', { className: 'num' }, 'Δ en el pedido')
        )),
        h('tbody', null, filas.map((f, i) => {
          const dU = f.r.precioUnitUsd - mejor.r.precioUnitUsd;
          const dPct = mejor.r.precioUnitUsd > 0 ? (dU / mejor.r.precioUnitUsd) * 100 : 0;
          const dTotal = dU * (Number(f.c.cantidad) || 0);
          return h('tr', { key: f.c.id, className: i === 0 ? 'fila-mejor' : '' },
            h('td', null, i === 0
              ? h('span', { className: 'badge-mejor' }, 'MEJOR')
              : String(i + 1)),
            h('td', null, f.c.proveedor || '(sin nombre)'),
            h('td', { className: 'num' }, f.c.cantidad || '—'),
            h('td', { className: 'num strong' }, moneyUsd(f.r.precioUnitUsd)),
            tcOk ? h('td', { className: 'num' }, money(f.r.precioUnitUsd * tcNum)) : null,
            h('td', { className: 'num' }, moneyUsd(f.r.totalUsd)),
            h('td', { className: 'num ' + (i === 0 ? 'ok' : 'warn') },
              i === 0 ? '—' : '+' + moneyUsd(dU) + ' (' + dPct.toFixed(1) + '%)'),
            h('td', { className: 'num ' + (i === 0 ? 'ok' : 'warn') },
              i === 0 ? '—' : '+' + moneyUsd(dTotal))
          );
        }))
      )
    ),
    h('p', { className: 'comparador-nota' },
      'Mejor landed: ' + (mejor.c.proveedor || 'la primera cotización') + ' a ' +
      moneyUsd(mejor.r.precioUnitUsd) + '/unidad. Mirá también la columna Inversión total: ' +
      'un unitario más bajo puede exigir un pedido más grande y dejarte más capital inmovilizado.')
  );
}

// ---------- Competencia: rango de precios y señales del mercado ----------
function CompetenciaBloque({ data, onChange, mejorLandedArs }) {
  const h = React.createElement;
  const d = data || {};
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState('');
  const [cfg, setCfg] = useState(leerCfgBackend());
  const [verCfg, setVerCfg] = useState(false);

  const set = (campo, valor) => onChange({ ...d, [campo]: valor });

  const traerDatos = async () => {
    const urls = (d.links || '').split('\n').map(s => s.trim()).filter(Boolean);
    if (!urls.length) { setError('Pegá al menos un link de una publicación rival.'); return; }
    if (!cfg.url) { setError('Configurá la URL del backend.'); return; }
    setCargando(true); setError('');
    try {
      const base = cfg.url.replace(/\/+$/, '');
      const resp = await fetch(base + '/api/competencia?urls=' + encodeURIComponent(urls.join(',')), {
        headers: cfg.key ? { 'x-api-key': cfg.key } : {}
      });
      const texto = await resp.text();
      let json; try { json = JSON.parse(texto); } catch (e) { json = { error: texto }; }
      if (!resp.ok) throw new Error(json.error || ('HTTP ' + resp.status));
      onChange({ ...d, datos: json, consultado: new Date().toISOString() });
      if (json.errores && json.errores.length) {
        setError(json.errores.length + ' link(s) no se pudieron leer — revisá que sean publicaciones de ML.');
      }
    } catch (e) {
      setError('No se pudo consultar: ' + e.message +
        (String(e.message).includes('Failed to fetch')
          ? ' — si el servidor estaba dormido, esperá ~50 s y reintentá.' : ''));
    } finally {
      setCargando(false);
    }
  };

  const datos = d.datos || null;
  const pubs = (datos && datos.publicaciones) || [];
  const resumen = datos && datos.resumen;

  // Viabilidad: con el mejor landed y la estructura de costos de ML,
  // ¿qué margen queda vendiendo a los precios que hay hoy en el mercado?
  const cargo = Number(d.cargoVenta), fin = Number(d.financiamiento), envio = Number(d.envioML);
  const costosOk = !isNaN(cargo) && !isNaN(fin) && !isNaN(envio) &&
    d.cargoVenta !== '' && d.financiamiento !== '' && d.envioML !== '' &&
    mejorLandedArs > 0;
  const margenA = (precio) => {
    const recibis = precio - precio * (cargo / 100) - precio * (fin / 100) - envio;
    const ganancia = recibis - mejorLandedArs;
    return { ganancia, margen: precio > 0 ? (ganancia / precio) * 100 : 0 };
  };
  // Landed máximo pagable para sostener un margen objetivo al precio de mercado
  const objetivo = Number(d.margenObjetivo);
  const techoLanded = (precio) => {
    const recibis = precio - precio * (cargo / 100) - precio * (fin / 100) - envio;
    return recibis - precio * (objetivo / 100);
  };

  return h('div', { className: 'competencia' },
    h('div', { className: 'comparador-head' },
      h('h3', null, 'Competencia en Mercado Libre'),
      h('button', {
        type: 'button', className: 'link-btn',
        onClick: () => setVerCfg(v => !v)
      }, verCfg ? 'ocultar conexión' : 'conexión')
    ),

    verCfg && h('div', { className: 'competencia-cfg' },
      h('label', null, h('span', null, 'URL del backend'),
        h('input', {
          type: 'text', value: cfg.url,
          onChange: e => { const c = { ...cfg, url: e.target.value }; setCfg(c); guardarCfgBackend(c.url, c.key); }
        })),
      h('label', null, h('span', null, 'API key del panel'),
        h('input', {
          type: 'password', value: cfg.key, placeholder: 'PANEL_API_KEY',
          onChange: e => { const c = { ...cfg, key: e.target.value }; setCfg(c); guardarCfgBackend(c.url, c.key); }
        }))
    ),

    h('label', { className: 'competencia-links' },
      h('span', { className: 'calc-field-label' }, 'Links de publicaciones rivales (uno por línea)'),
      h('textarea', {
        rows: 3, value: d.links || '',
        placeholder: 'https://articulo.mercadolibre.com.ar/MLA-...\nhttps://articulo.mercadolibre.com.ar/MLA-...',
        onChange: e => set('links', e.target.value)
      })
    ),
    h('div', { className: 'competencia-acciones' },
      h('button', {
        type: 'button', className: 'add-btn', onClick: traerDatos, disabled: cargando
      }, cargando ? 'Consultando…' : 'Traer datos de ML'),
      d.consultado && h('span', { className: 'competencia-fecha' },
        'Último dato: ' + new Date(d.consultado).toLocaleString('es-AR'))
    ),
    error && h('div', { className: 'competencia-error' }, error),

    resumen && h('div', { className: 'rango-grid' },
      h(CampoCalculado, { label: 'Precio mínimo', value: money(resumen.precio_min) }),
      h(CampoCalculado, { label: 'Mediana', value: money(resumen.precio_mediana), highlight: true }),
      h(CampoCalculado, { label: 'Promedio', value: money(resumen.precio_promedio) }),
      h(CampoCalculado, { label: 'Precio máximo', value: money(resumen.precio_max) }),
      h(CampoCalculado, { label: 'Vendidos (suma)', value: String(resumen.vendidos_total) })
    ),

    pubs.length > 0 && h('div', { className: 'comparador-scroll' },
      h('table', { className: 'comparador-tabla competencia-tabla' },
        h('thead', null, h('tr', null,
          h('th', null, 'Publicación'),
          h('th', { className: 'num' }, 'Precio'),
          h('th', { className: 'num' }, 'Vendidos'),
          h('th', { className: 'num' }, 'Stock'),
          h('th', null, 'Cuotas'),
          h('th', null, 'Tipo'),
          h('th', { className: 'num' }, 'Estrellas'),
          h('th', { className: 'num' }, 'Opiniones'),
          h('th', null, 'Envío')
        )),
        h('tbody', null, pubs.map(p => h('tr', { key: p.id },
          h('td', null, p.permalink
            ? h('a', { href: p.permalink, target: '_blank', rel: 'noreferrer' }, (p.titulo || p.id).slice(0, 46))
            : (p.titulo || p.id)),
          h('td', { className: 'num strong' }, money(p.precio)),
          h('td', { className: 'num' }, p.vendidos != null ? String(p.vendidos) : '—'),
          h('td', { className: 'num' }, p.stock_disponible != null ? String(p.stock_disponible) : '—'),
          h('td', null, p.cuotas
            ? h('span', { className: p.cuotas.sin_interes ? 'chip ok' : 'chip' },
                p.cuotas.cantidad + 'x ' + money(p.cuotas.monto) + (p.cuotas.sin_interes ? ' s/interés' : ''))
            : '—'),
          h('td', null, p.tipo_publicacion || '—'),
          h('td', { className: 'num' }, p.reviews && p.reviews.estrellas != null
            ? '★ ' + Number(p.reviews.estrellas).toFixed(1) : '—'),
          h('td', { className: 'num' }, p.reviews && p.reviews.cantidad != null
            ? String(p.reviews.cantidad) : '—'),
          h('td', null, p.envio_gratis ? h('span', { className: 'chip ok' }, 'gratis') : '—')
        )))
      )
    ),

    // ----- Viabilidad -----
    resumen && h('div', { className: 'viabilidad' },
      h('h4', null, '¿Conviene traerlo?'),
      h('p', { className: 'viabilidad-hint' },
        'Con el mejor landed de arriba (' + (mejorLandedArs > 0 ? money(mejorLandedArs) : '—') +
        ') y tu estructura de costos de ML, este es el margen que te quedaría vendiendo a los precios que hay hoy.'),
      h('div', { className: 'viabilidad-inputs' },
        h('label', null, h('span', null, '% Cargo por venta'),
          h('input', { type: 'number', value: d.cargoVenta || '', onChange: e => set('cargoVenta', e.target.value) })),
        h('label', null, h('span', null, '% Financiamiento'),
          h('input', { type: 'number', value: d.financiamiento || '', onChange: e => set('financiamiento', e.target.value) })),
        h('label', null, h('span', null, 'Costo envío ML ($)'),
          h('input', { type: 'number', value: d.envioML || '', onChange: e => set('envioML', e.target.value) })),
        h('label', null, h('span', null, '% Margen objetivo'),
          h('input', { type: 'number', value: d.margenObjetivo || '', onChange: e => set('margenObjetivo', e.target.value) }))
      ),
      !costosOk && h('div', { className: 'comp-hint' },
        'Completá los tres costos de ML (los sacás del simulador) y mandá una cotización a Costos para ver la viabilidad.'),
      costosOk && h('div', { className: 'viabilidad-out' },
        [['Al precio mínimo', resumen.precio_min],
         ['A la mediana', resumen.precio_mediana],
         ['Al precio máximo', resumen.precio_max]].map(([etiqueta, precio]) => {

const CLAVES_RESPALDO = [
  'jopex_costos_productos',

// Modo web: los datos viven en el servidor, no en el navegador
// ---------------------------------------------------------------------------
// Cuando el panel se sirve desde /panel, el servidor inyecta window.JOPEX_WEB.
// En ese modo el panel carga el estado del servidor al abrir y lo guarda solo
// cada vez que cambia algo, así ves lo mismo desde la compu y desde el celular.
const MODO_WEB = typeof window !== 'undefined' && window.JOPEX_WEB === true;

  estadoSync = { estado, detalle: detalle || '' };

async function cargarEstadoDelServidor() {
  if (!MODO_WEB) return;
  try {
    const r = await fetch(API_BASE + '/api/estado');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j && j.datos && Object.keys(j.datos).length) {
      Object.keys(j.datos).forEach(k => {
        if (j.datos[k] != null) window.localStorage.setItem(k, j.datos[k]);
      });
    }
  } catch (e) {
    console.warn('No se pudo cargar el estado del servidor:', e.message);
  }
}

async function guardarEstadoYa() {
  if (!MODO_WEB) return true;
  clearTimeout(timerGuardado);
  avisarSync('guardando');
  try {
    const datos = {};
    CLAVES_RESPALDO.forEach(k => {
      const v = window.localStorage.getItem(k);
      if (v != null) datos[k] = v;
    });
    const r = await fetch(API_BASE + '/api/estado', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ datos, origen: (navigator.userAgent || '').slice(0, 60) })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    avisarSync('ok');
    return true;
  } catch (e) {
    avisarSync('error', e.message);
    return false;
  }
}

  if (!MODO_WEB) return;
  avisarSync('pendiente');
  clearTimeout(timerGuardado);
  // Esperamos a que dejes de tipear antes de guardar, para no mandar
  // una petición por cada tecla.
  timerGuardado = setTimeout(async () => {
    avisarSync('guardando');
    try {
      const datos = {};
      CLAVES_RESPALDO.forEach(k => {
        const v = window.localStorage.getItem(k);
        if (v != null) datos[k] = v;
      });
